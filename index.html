<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>بازار آلمان - نیازمندی‌ها و خرید و فروش کالا و خدمات در سراسر آلمان</title>
    <meta name="description" content="سامانه نیازمندی‌ها، خرید و فروش کالا و خدمات دست دوم، خودرو و املاک برای فارسی‌زبانان در سراسر ایالت‌ها و شهرهای آلمان" />
    <meta property="og:title" content="بازار آلمان - نیازمندی‌ها و خرید و فروش کالا و خدمات" />
    <meta property="og:description" content="سامانه نیازمندی‌ها، خرید و فروش کالا و خدمات دست دوم، خودرو و املاک برای فارسی‌زبانان در سراسر ایالت‌ها و شهرهای آلمان" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Vazirmatn', 'Vazir', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#C61F2B',
                hover: '#A71923',
                light: '#FDECEE',
              },
              secondary: '#A71923',
              canvas: '#F6F7F8',
              surface: '#FFFFFF',
              border: '#E5E7EB',
              'text-primary': '#171717',
              'text-secondary': '#6B7280',
              'text-muted': '#9CA3AF',
              success: '#16A34A',
              warning: '#F59E0B',
              danger: '#DC2626',
            },
            boxShadow: {
              card: '0 2px 12px rgba(0,0,0,0.04)',
              'card-hover': '0 8px 25px rgba(0,0,0,0.08)',
            },
            maxWidth: {
              page: '1320px',
            },
            transitionDuration: {
              DEFAULT: '200ms',
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --color-primary: #C61F2B;
        --color-primary-hover: #A71923;
        --color-primary-light: #FDECEE;
        --color-background: #F6F7F8;
        --color-surface: #FFFFFF;
        --color-text: #171717;
        --color-text-secondary: #6B7280;
        --color-text-muted: #9CA3AF;
        --color-border: #E5E7EB;
        --radius-card: 16px;
        --radius-button: 12px;
        --shadow-card: 0 2px 12px rgba(0,0,0,0.04);
        --shadow-card-hover: 0 8px 25px rgba(0,0,0,0.08);
      }

      .dark {
        --color-background: #0f141c;
        --color-surface: #111827;
        --color-text: #f3f4f6;
        --color-border: #374151;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      * { font-feature-settings: "ss01"; }

      body {
        font-family: 'Vazirmatn', 'Vazir', sans-serif;
        background-color: var(--color-background);
        color: var(--color-text);
        line-height: 1.8;
      }

      h1, h2, h3, h4 { line-height: 1.4; }

      @keyframes modal-in {
        from { opacity: 0; transform: scale(0.97) translateY(8px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      .animate-modal-in { animation: modal-in 0.2s ease-out; }

      @keyframes toast-in {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-toast-in { animation: toast-in 0.2s ease-out; }

      :focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body class="bg-canvas dark:bg-[#0f141c] text-text-primary dark:text-gray-100 transition-colors duration-200 min-h-screen antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
